<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNP Stream Wrangler — APK.audio</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .workspace {
      display: grid;
      grid-template-columns: 1fr 340px;
      flex: 1;
      overflow: hidden;
    }
    .panel-right {
      background: var(--osc-bg-surface);
      border-left: 1px solid var(--osc-border-default);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--osc-text-muted);
      border-bottom: 1px solid var(--osc-border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-body {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }
    .canvas-viewport {
      background: var(--osc-bg-base);
      overflow: auto;
      display: flex;
      padding: 20px;
    }
    .discovered-panel {
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      padding: 8px 14px;
      max-height: 40vh;
      overflow: auto;
    }
    .discovered-status { font-size: 11px; margin-bottom: 6px; }
    .toolbar-bar {
      height: 36px;
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }
  </style>
</head>
<body>
  <header class="app-window-header">
    <div class="window-title-group">
      <div class="window-dot" style="background: #10B981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);"></div>
      <span class="window-title">SNP Stream Wrangler</span>
      <span class="window-pill" id="block-tag" style="color: #10B981;">SMPTE ST 2110 / 2022-7</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary btn-sm" id="btn-open-block">📂 Open Block</button>
      <button class="btn btn-secondary btn-sm" id="btn-discovered">⚡ Discovered</button>
      <button class="btn btn-secondary btn-sm" id="btn-export-csv">📥 Export CSV</button>
      <button class="btn btn-primary btn-sm" id="btn-save-block">💾 Save & Return</button>
      <button class="btn btn-icon btn-sm" id="btn-close" title="Close Window">✕</button>
    </div>
  </header>

  <div class="toolbar-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="btn btn-secondary btn-sm" id="btn-add-stream">➕ Add Stream Leg</button>
      <span style="font-size: 11px; color: var(--osc-text-muted);">Selenio Network Processor dual Red/Blue leg multicast stream assignments</span>
    </div>
  </div>

  <section class="discovered-panel" id="discovered-panel" hidden>
    <div class="discovered-status apk-state-text" id="discovered-status" data-apk-state="kinda">Not asked yet.</div>
    <div id="discovered-table" class="apk-table-host"></div>
  </section>

  <div class="workspace">
    <!-- Center Stream Canvas -->
    <main class="canvas-viewport" id="canvas-wrapper">
      <!-- SNP SVG dynamically rendered here -->
    </main>

    <!-- Right Inspector & Redundancy Audit -->
    <aside class="panel-right">
      <div class="panel-header">
        <span>STREAM INSPECTOR</span>
      </div>
      <div class="panel-body" id="inspector-content">
        <!-- Stream properties rendered dynamically -->
      </div>
      <div style="padding: 12px; border-top: 1px solid var(--osc-border-default);" id="redundancy-audit">
        <!-- Hitless audit alerts rendered here -->
      </div>
    </aside>
  </div>

  <!-- The one softapp client (ROAD-3485): contracts, bus, CAD bridge, table. Classic scripts, before the module. -->
  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
